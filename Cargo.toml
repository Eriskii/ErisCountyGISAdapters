[package]
name = "erisgisscraper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ErisHarness agents that find, write and validate an adapter for every US county, for each ErisGIS dataset"

[[bin]]
name = "eris-gis-scraper"
path = "src/main.rs"

[dependencies]
erisgis = { path = "erisgis" }
erisharness = { git = "https://github.com/Eriskii/ErisHarness" }
erisagentauth = { git = "https://github.com/Eriskii/ErisAgentAuth", tag = "v0.2.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
erisgis = { path = "erisgis", features = ["testing"] }
axum = "0.8.9"
tempfile = "3.27.0"

[workspace]
members = ["erisgis"]

[profile.dev.package."*"]
opt-level = 2
