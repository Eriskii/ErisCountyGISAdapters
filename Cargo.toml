[package]
name = "eriscountygis"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ErisHarness agents that find, write and validate a parcel adapter for every US county"

[[bin]]
name = "eris-county-gis"
path = "src/main.rs"

[dependencies]
erisharness = { git = "https://github.com/Eriskii/ErisHarness" }
erisagentauth = { git = "https://github.com/Eriskii/ErisAgentAuth", tag = "v0.2.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
crossterm = "0.29.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
geo = "0.33.1"
ratatui = "0.30.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shapefile = "0.9.0"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

[workspace]

[profile.dev.package."*"]
opt-level = 2
